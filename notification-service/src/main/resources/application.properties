spring.application.name=notification-service

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# Zipkin tracing
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0

server.port=0

# Kafka
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.template.default-topic=notificationTopic

# Consumer - receive String key and JSON value
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trusted package for JSON
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap
# Consumer group id
spring.kafka.consumer.group-id=notification-group
#spring.kafka.consumer.properties.spring.json.type.mapping=com.devtechi.order_service.event.OrderPlaceEvent:com.devtechi.dev.OrderPlaceEvent
# Allow both packages for trusted deserialization
spring.kafka.consumer.properties.spring.json.trusted-packages=com.devtechi.order_service.event,com.devtechi.dev.model

# Map producer class to consumer class
spring.kafka.consumer.properties.spring.json.type.mapping=com.devtechi.order_service.event.OrderPlaceEvent:com.devtechi.dev.model.OrderPlaceEvent


