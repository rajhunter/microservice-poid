spring.application.name=order-service

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/order_service
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
server.port=8081
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

spring.cloud.compatibility-verifier.enabled=false

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true


resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=10
resilience4j.circuitbreaker.instances.inventory.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.inventory.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventory.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.inventory.slidingWindowType=COUNT_BASED

# TimeLimiter configuration (timeout for calls)
resilience4j.timelimiter.instances.inventory.timeout-duration=5s

resilience4j.retry.instances.inventory.max-attempts=3
resilience4j.retry.instances.inventory.wait-duration=5s

#old boot 2.X
#spring.zipkin.base-url= http://localhost:9411/zipkin
#spring.sleuth.sampler.probability=1.0
#old boot 3.X
# Sample all requests (like Sleuth probability=1.0)
management.tracing.sampling.probability=1.0

# Send traces to Zipkin
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans